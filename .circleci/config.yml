version: 2.1

executors:
  python-container:
    parameters:
      python_version:
        type: string
        default: "3.12"
    docker:
      - image: cimg/python:<< parameters.python_version >>
    resource_class: arangodb/medium-amd64
  python-vm:
    machine:
      image: ubuntu-2404:current
    resource_class: medium

workflows:
  ci:
    jobs:
      - lint
      - test:
          name: Python (<< matrix.python_version >>) - ArangoDB (enterprise, << matrix.arangodb_version >> << matrix.arangodb_config >>)
          matrix:
            parameters:
              python_version: ["3.13"]
              arangodb_config: ["single", "cluster"]
              arangodb_license: ["enterprise"]
              arangodb_version: ["3.12"]
      - test:
          name: Python (<< matrix.python_version >>) - ArangoDB (enterprise-preview, << matrix.arangodb_version >> << matrix.arangodb_config >>)
          matrix:
            parameters:
              python_version: ["3.13"]
              arangodb_config: ["single", "cluster"]
              arangodb_license: ["enterprise-preview"]
              arangodb_version: ["4.0-nightly"]
      - test:
          name: Python (<< matrix.python_version >>) - ArangoDB (enterprise, 3.12 cluster)
          matrix:
            parameters:
              python_version: ["3.10", "3.11", "3.12"]
              arangodb_config: ["cluster"]
              arangodb_license: ["enterprise"]
              arangodb_version: ["3.12"]

jobs:
  lint:
    executor: python-container
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: pip install .[dev]
      - run:
            name: Run black
            command: black --check --verbose --diff --color --config=pyproject.toml ./arangoasync ./tests/
      - run:
          name: Run flake8
          command: flake8 ./arangoasync ./tests
      - run:
          name: Run isort
          command: isort --check ./arangoasync ./tests
      - run:
          name: Run mypy
          command: mypy ./arangoasync
  test:
    parameters:
        python_version:
            type: string
        arangodb_config:
            type: string
        arangodb_license:
            type: string
        arangodb_version:
            type: string
    executor:
      name: python-container
      python_version: << parameters.python_version >>
    steps:
      - checkout
      - run:
          name: Resolve ArangoDB Host
          command: |
            if [ -z "${ARANGO_HOST:-}" ]; then
              if getent hosts host.docker.internal >/dev/null 2>&1; then
                ARANGO_HOST=host.docker.internal
              elif command -v ip >/dev/null 2>&1; then
                ARANGO_HOST="$(ip route show default | awk '{print $3; exit}')"
              else
                ARANGO_HOST=localhost
              fi
            fi

            if [ -z "$ARANGO_HOST" ]; then
              echo "Could not determine ARANGO_HOST"
              exit 1
            fi

            echo "export ARANGO_HOST=$ARANGO_HOST" >> "$BASH_ENV"
            echo "Using ARANGO_HOST=$ARANGO_HOST"
      - run:
          name: Setup ArangoDB
          command: |
            chmod +x starter.sh
            ./starter.sh << parameters.arangodb_config >> << parameters.arangodb_license >> << parameters.arangodb_version >>
      - restore_cache:
          key: pip-and-local-cache
      - run:
          name: Setup Python
          command: |
            python --version
            pip --version
      - run:
          name: Install Dependencies
          command: pip install -e .[dev]
      - run: docker ps -a
      - run: docker logs arango
      - run:
          name: Run pytest
          command: |
            mkdir test-results
            mkdir htmlcov

            args=("--junitxml=test-results/junit.xml" "--log-cli-level=DEBUG" "--host" "$ARANGO_HOST" "--port=8529")
            if [ << parameters.arangodb_config >> = "cluster" ]; then
              args+=("--cluster" "--port=8539" "--port=8549")
            fi

            if [ << parameters.arangodb_license >> != "enterprise" ] && [ << parameters.arangodb_license >> != "enterprise-preview" ]; then
              args+=("--skip" "enterprise")
            fi

            echo "Running pytest with args: ${args[@]}"
            pytest --cov=arangoasync --cov-report=html:htmlcov --color=yes --code-highlight=yes "${args[@]}"
      - store_artifacts:
          path: htmlcov
          destination: coverage-report
      - store_artifacts:
          path: test-results
      - store_test_results:
          path: test-results
